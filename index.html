<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3B3FA3" />
    <meta
      name="description"
      content="نونو — نظام إدارة الحضانات: تقرير يومي وصور خاصة لكل طفل، رسوم وإثباتات دفع، وحضور واستلام آمن."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="نونو" />
    <script>
      // تهيئة الثيم قبل أول رسم: نفس منطق useTheme ونفس مفتاح التخزين
      try {
        var savedTheme = localStorage.getItem('nounou-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark) ? 'dark' : 'light'
      } catch (e) {
        /* بلا وصول للتخزين: يبقى الافتراضي الفاتح من CSS */
      }
    </script>
    <title>نونو — إدارة الحضانات</title>
    <!-- الخط (IBM Plex Sans Arabic) مضمّن محلياً عبر @fontsource في main.tsx -->
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <svg id="boot-mark" width="92" height="92" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#3B3FA3" />
          <path d="M32 46c0-10 0-16 0-22" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" />
          <path d="M32 28c-7 1-11-3-12-10 7-1 11 3 12 10Z" fill="#FFA726" />
          <path d="M32 24c1-7 6-10 12-10 0 7-4 11-12 10Z" fill="#00D2FF" />
        </svg>
        <div class="boot-name">نونو</div>
      </div>
      <style>
        #boot-splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f7f8fc; }
        :root[data-theme="dark"] #boot-splash { background: #0e1120; }
        #boot-mark { animation: boot-bounce 1.2s ease-in-out infinite; }
        .boot-name { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; font-weight: 800; font-size: 24px; color: #141a2e; }
        :root[data-theme="dark"] .boot-name { color: #f2f4fa; }
        @keyframes boot-bounce {
          0%, 100% { transform: translateY(0) scale(1, 1); }
          30% { transform: translateY(-10px) scale(0.98, 1.03); }
          55% { transform: translateY(0) scale(1.04, 0.95); }
          75% { transform: translateY(-4px) scale(1, 1.01); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
