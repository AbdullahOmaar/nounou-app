<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2E4A7A" />
    <meta
      name="description"
      content="نونو — نظام إدارة الحضانات: تقرير يومي وصور خاصة لكل طفل، رسوم وإثباتات دفع، وحضور واستلام آمن."
    />
    <!-- أساس SEO وبطاقات المشاركة (الاكتشاف 3A-891) — الصفحات العامة تستبدلها وقت التشغيل ببيانات الحضانة -->
    <link rel="canonical" href="https://nounou-app-psi.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="نونو" />
    <meta property="og:title" content="نونو — إدارة الحضانات" />
    <meta
      property="og:description"
      content="نونو — نظام إدارة الحضانات: تقرير يومي وصور خاصة لكل طفل، رسوم وإثباتات دفع، وحضور واستلام آمن."
    />
    <meta property="og:url" content="https://nounou-app-psi.vercel.app/" />
    <meta property="og:image" content="https://nounou-app-psi.vercel.app/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="نونو — إدارة الحضانات" />
    <meta
      name="twitter:description"
      content="نونو — نظام إدارة الحضانات: تقرير يومي وصور خاصة لكل طفل، رسوم وإثباتات دفع، وحضور واستلام آمن."
    />
    <meta name="twitter:image" content="https://nounou-app-psi.vercel.app/og-card.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="نونو" />
    <script>
      // تهيئة الثيم قبل أول رسم: نفس منطق useTheme ونفس مفتاح التخزين
      try {
        var savedTheme = localStorage.getItem('nounou-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark) ? 'dark' : 'light'
      } catch (e) {
        /* بلا وصول للتخزين: يبقى الافتراضي الفاتح من CSS */
      }
    </script>
    <title>نونو — إدارة الحضانات</title>
    <!-- الخط (IBM Plex Sans Arabic) مضمّن محلياً عبر @fontsource في main.tsx -->
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img id="boot-mark" src="/logo.svg" width="92" height="92" alt="" />
        <div class="boot-name">نونو</div>
      </div>
      <style>
        #boot-splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #fff8ee; }
        :root[data-theme="dark"] #boot-splash { background: #141a28; }
        #boot-mark { animation: boot-bounce 1.2s ease-in-out infinite; }
        .boot-name { font-family: "Baloo Bhaijaan 2", "IBM Plex Sans Arabic", system-ui, sans-serif; font-weight: 800; font-size: 24px; color: #2f2a26; }
        :root[data-theme="dark"] .boot-name { color: #f5ede0; }
        @keyframes boot-bounce {
          0%, 100% { transform: translateY(0) scale(1, 1); }
          30% { transform: translateY(-10px) scale(0.98, 1.03); }
          55% { transform: translateY(0) scale(1.04, 0.95); }
          75% { transform: translateY(-4px) scale(1, 1.01); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
