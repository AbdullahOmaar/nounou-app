<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>نونو — الشعار</title>
  <!-- الدبدوب بالفيونكة الكهرمانية (هوية نونو — الموجة 0، DESIGN §2.5):
       وجه دبدوب بُنّي فاتح مبسّط داخل مربع مدوّر كحلي -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#2E4A7A"/>
  <!-- الأذنان -->
  <circle cx="20" cy="23" r="7" fill="#C89B6A"/>
  <circle cx="44" cy="23" r="7" fill="#C89B6A"/>
  <circle cx="20" cy="23" r="3.5" fill="#E3B77F"/>
  <circle cx="44" cy="23" r="3.5" fill="#E3B77F"/>
  <!-- الوجه -->
  <circle cx="32" cy="36" r="14" fill="#E3B77F"/>
  <!-- الخطم الكريمي -->
  <ellipse cx="32" cy="40.5" rx="7.5" ry="5.5" fill="#FFF8EE"/>
  <!-- العينان -->
  <circle cx="26.5" cy="33" r="1.9" fill="#2F2A26"/>
  <circle cx="37.5" cy="33" r="1.9" fill="#2F2A26"/>
  <!-- الأنف الكحلي -->
  <ellipse cx="32" cy="38" rx="2.6" ry="2" fill="#21365C"/>
  <!-- الفم -->
  <path d="M28.5 42 Q30.2 44 32 42.5 Q33.8 44 35.5 42" stroke="#2F2A26" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- الفيونكة الكهرمانية على الأذن اليمنى -->
  <g fill="#F5A623">
    <path d="M45 18 L37 12 L37 24 Z"/>
    <path d="M45 18 L53 12 L53 24 Z"/>
    <circle cx="45" cy="18" r="2.8"/>
  </g>
</svg>
